name: Project tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run Spark and Delta integration tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        if: ${{ inputs.integration == true }}
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m compileall -q projects tests
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt
        if: ${{ inputs.integration == true }}
      - run: python -m unittest discover -s tests -v
        if: ${{ inputs.integration == true }}
        env:
          RUN_SPARK_TESTS: '1'
          PYSPARK_SUBMIT_ARGS: --master local[2] pyspark-shell
